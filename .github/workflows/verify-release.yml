name: verify-release

# Rebuilds the single file from the release tag on a clean GitHub machine and
# compares it with both the downloadable file and the SHA-256 in the release's
# SHA256SUMS manifest, so a release can be checked without trusting the machine
# that built it.
# Read-only: no secrets beyond the default token, nothing is published.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to verify, for example v2.0.6"
        required: true

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Rebuild from the tag
        run: python build/bundle.py . rebuilt.py

      - name: Check the published file and its checksum
        run: |
          set -eu
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published --pattern SHA256SUMS --pattern securail.py
          # Exactly one manifest entry for the scanner.
          test "$(awk '$2 == "securail.py"' published/SHA256SUMS | wc -l)" -eq 1
          expected=$(awk '$2 == "securail.py" {print $1}' published/SHA256SUMS)
          rebuilt=$(sha256sum rebuilt.py | cut -d' ' -f1)
          download=$(sha256sum published/securail.py | cut -d' ' -f1)
          echo "published checksum SHA-256: $expected"
          echo "downloadable      SHA-256: $download"
          echo "rebuilt           SHA-256: $rebuilt"
          test -n "$expected"
          test "$expected" = "$rebuilt"
          test "$download" = "$rebuilt"
          # The manifest must describe the file beside it, not some other build.
          ( cd published && sha256sum -c SHA256SUMS )
          echo "The downloadable file is exactly what the tagged source builds."
